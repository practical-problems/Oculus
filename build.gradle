plugins {
	id 'dev.architectury.loom' version '1.2-SNAPSHOT'
	id 'maven-publish'
}

loom {
    silentMojangMappingsLicense()
	
	forge {
		mixinConfigs = [
				"mixins.oculus.json",
				"mixins.oculus.fantastic.json",
				"mixins.oculus.vertexformat.json",
				"mixins.oculus.bettermipmaps.json",
				"mixins.oculus.fixes.maxfpscrash.json",
				"oculus-batched-entity-rendering.mixins.json",
				"mixins.oculus.compat.dh.json",
				"mixins.oculus.compat.sodium.json",
				"mixins.oculus.compat.indigo.json",
				"mixins.oculus.compat.indium.json"
		]
	}
	mixin.defaultRefmapName = "oculus-mixins-refmap.json"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = "${project.archives_base_name}-mc${project.minecraft_version}"
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	
	modCompileOnly "maven.modrinth:rubidium:0.6.2c"
	// DH 3.3.3 for 1.19.2: drop DistantHorizons-3.3.3-1.19.2-fabric-forge.jar into ./libs (git-ignored).
	// compileOnly (not modCompileOnly): we only need DH's own interfaces, and the jar is a merged fabric+forge build.
	compileOnly files("libs/DistantHorizons-3.3.3-1.19.2-fabric-forge.jar")
	//modCompileOnly "me.jellysquid.mods:Rubidium:0.6.3"
}

// mods.toml version shown in the launcher's mod list. DH checks it against its [1.8.0,) dependency,
// so it starts with 1.8.0. The jar file name uses mod_version instead.
def modLabel = project.findProperty("mod_label") ?: project.version

processResources {
	inputs.property "version", modLabel

	filesMatching("META-INF/mods.toml") {
        expand "version": modLabel
    }
}

java {
	withSourcesJar()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
