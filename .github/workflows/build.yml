name: Build

# Builds the Spectacles jar on pushes to the stable and dev branches (skipped when a push only changes docs), and on demand.
# Pushing a tag like v1.0.0 also creates a draft GitHub release with the jar attached (path filters do not apply to tags).
on:
  push:
    branches:
      - dh-3.3.3-mekanism
      - dh-3.3.3-mekanism-dev
    tags:
      - 'v*'
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write  # only used by the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Distant Horizons is compile-only (not bundled in the jar). It is downloaded here and checked
      # against Modrinth's SHA-512, never committed to the repository.
      DH_JAR: DistantHorizons-3.3.3-1.19.2-fabric-forge.jar
      DH_URL: https://cdn.modrinth.com/data/uCdwusMi/versions/tdsUxAVV/DistantHorizons-3.3.3-1.19.2-fabric-forge.jar
      DH_SHA512: e1145cb42af56a7de59ab3e3fa82eeb37642b0035ea2f723b5252ec2866ca8c267a26089fd1d3b721b51fc161794105db92bf0e8b77a1c7e1b49418a6121b01c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # Minecraft 1.19.2 toolchain; JDK 21+ fails in repackaged commons-collections
          cache: gradle

      - name: Download Distant Horizons 3.3.3 (compile-only)
        run: |
          mkdir -p libs
          curl -fsSL --retry 3 -o "libs/$DH_JAR" "$DH_URL"
          echo "$DH_SHA512  libs/$DH_JAR" | sha512sum -c -

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spectacles-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release create "${{ github.ref_name }}" "$jar" --draft --verify-tag \
            --title "Spectacles ${GITHUB_REF_NAME#v}" \
            --notes "Draft created by the build workflow. Edit the notes before publishing."
